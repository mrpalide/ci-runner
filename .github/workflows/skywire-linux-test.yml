name: Skywire Linux Test
run-name: "Skywire Linux Test - ${{ github.event.client_payload.dispatch_id }}"

on:
  repository_dispatch:
    types: [skywire-linux-test]

jobs:
  linux:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: refs/pull/${{ github.event.client_payload.pr_number }}/merge
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
          cache: true
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Install Dependencies
        shell: bash
        run: make install-shellcheck

      - name: Lint Shell Scripts
        run: make lint-shell

      - name: Check Format and Run Tests
        run: make check

      - name: Setup SSH Key, Build and Run E2E
        shell: bash
        run: |
          set -e
          sudo ./ci_scripts/create-ip-aliases.sh
          make e2e-build
          make e2e-run
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}

      - name: Test E2E
        run: make e2e-test

      - name: Clean E2E
        run: make e2e-stop
